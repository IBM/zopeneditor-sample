---
rules:
  # Selection of ZCodeScan built-in rules for the SAM COBOL application
  - id: zcodescan.cobol.rules.AcceptDateTimeRule
    severity: MEDIUM
  - id: "zcodescan.cobol.rules.EvaluateNotIfRule"
    severity: MEDIUM
  - id: zcodescan.cobol.rules.RequireEndClauseRule
    severity: HIGH
    statements:
      - name: "If"
        value: true
      - name: "Evaluate"
        value: true
      - name: "Read"
        value: true
      - name: "Search"
        value: true
      - name: "Call"
        value: true
  - id: zcodescan.cobol.rules.ProgramIdRule
    severity: INFO
  - id: zcodescan.cobol.rules.FileNameConventionRule
    severity: HIGH
    parameters:
      - name: "ConventionMask"
        value: "SA.*"

  # Custom rule defined in ./rules-domain.yaml
  # Require that PROGRAM-ID be at least 4 characters long
  - id: custom.cobol.rules.regex.ProgramIdRule
    severity: INFO
    parameters:
      - name: "length"
        value: "4"
  - id: custom.cobol.rules.java.ProgramIdLengthRule
    severity: BLOCKER
    parameters:
      - name: "length"
        value: 4

  # The following rules were used during baseline creation.
  - id: zcodescan.cobol.rules.MagicNumberRule
    severity: MEDIUM
  - id: zcodescan.cobol.rules.TrackFixMeRule
    severity: MEDIUM
  - id: zcodescan.cobol.rules.TrackTodoRule
    severity: MEDIUM