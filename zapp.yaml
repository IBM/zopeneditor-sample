name: sam
description: For IBM Z Open Editor 6.6.0 and IDz 17.0.5 or newer. Wazi's code samples with COBOL, PL/I, and HLASM applications
version: 6.6.0
author:
  name: IBM CORPORATION

propertyGroups:
  - name: cobol-copybooks
    language: cobol
    libraries:
      - name: syslib
        type: local
        locations:
          - "**/COPYBOOK"
      - name: syslib
        type: mvs
        locations:
          - IBMUSER.SAMPLE.COBCOPY"
      - name: MYLIB
        type: mvs
        locations:
          - IBMUSER.SAMPLE.COPYLIB
      - name: MYLIB
        type: local
        locations:
          - "**/COPYLIB-MVS"
      - name: MYFILE
        type: local
        locations:
          - "**/COPYLIB"

  - name: pl1-includes
    language: pl1
    compilerOptions: not(!)
    libraries:
      - name: syslib
        type: local
        locations:
          - "**/INCLUDES"
      - name: syslib
        type: mvs
        locations:
          - IBMUSER.SAMPLE.PLINC
      - name: MYLIB
        type: mvs
        locations:
          - IBMUSER.SAMPLE.PLI.INCLLIB
      - name: MYLIB
        type: local
        locations:
          - "**/INCLUDELIB-MVS"
      - name: MYFILE
        type: local
        locations:
          - "**/INCLUDELIB"

  - name: hlasm-local
    language: hlasm
    libraries:
      - name: syslib
        type: local
        locations:
          - "**/ASMCOPY"
      - name: maclib
        type: local
        locations:
          - "**/ASMMAC"

  - name: rexx-local
    language: rexx
    libraries:
      - name: syslib
        type: local
        locations:
          - "**/REXXINC"
      - name: REXXLIB
        type: local
        locations:
          - "**/REXXLIB"

profiles:
  - name: zBuilder-userbuild
    type: dbb
    settings:
      command: "$DBB_HOME/bin/dbb build"
      lifecycle: user
      lifecycleArgs:
        - "--hlq ${dbbHlq}"
        - "--errPrefix ${errPrefix}"
      additionalDependencies:
        - "dbb-app.yaml"
      logFilePatterns:
        - "*.log"
        - "BuildReport.html"
        - "*.json"

  # Custom ZCodeScan rules example
  - name: zcodescan
    type: zcodescan
    settings:
      rules:
        - type: local
          locations:
            - "**/zcodescan/sam-rules.yaml"
            - "**/zcodescan/psam-rules.yaml"
      customRuleModels:
        - type: local
          locations:
            - "**/zcodescan/rules-domains.yaml"
      customRuleJars:
        - type: local
          locations:
            - "**/zcodescan/customrules/COBOL/cobol-customrules/target/zcodescan-1.0-SNAPSHOT.jar"
      baselines:
        - type: local
          locations:
            - "**/zcodescan/baseline.json"
